<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VRCL Client PRO</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, Segoe UI, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #100d19; color: #eeeaf7; }
    main { width: min(640px, calc(100% - 40px)); padding: 28px; border: 1px solid #39304e; border-radius: 18px; background: #191426; box-sizing: border-box; }
    h1 { margin-top: 0; letter-spacing: .02em; }
    p { color: #b9b0cb; line-height: 1.55; }
    label { display: block; margin: 22px 0 8px; color: #d8d0e6; }
    input { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 9px; border: 1px solid #514568; background: #100d19; color: #fff; }
    button { margin-top: 12px; padding: 11px 16px; border: 0; border-radius: 9px; background: #8858c7; color: white; cursor: pointer; font-weight: 600; }
    #result { margin-top: 18px; padding: 13px; border-radius: 9px; background: #231d32; color: #ddd4ef; }
    small { display: block; margin-top: 20px; color: #8f86a2; }
  </style>
</head>
<body>
  <main>
    <h1>VRCL Client PRO</h1>
    <p>Local control panel starter. This page checks API health only and never stores API secrets.</p>

    <label for="api">API address</label>
    <input id="api" value="http://127.0.0.1:8000" spellcheck="false">
    <button id="check">Check connection</button>
    <div id="result" role="status" aria-live="polite">Not checked yet.</div>

    <small>Authorized asset management features are not enabled in this starter build.</small>
  </main>
  <script>
    const apiInput = document.getElementById("api");
    const result = document.getElementById("result");

    document.getElementById("check").addEventListener("click", async () => {
      const base = apiInput.value.trim().replace(/\/$/, "");
      result.textContent = "Checking API…";
      try {
        const response = await fetch(base + "/health");
        if (!response.ok) throw new Error("HTTP " + response.status);
        const data = await response.json();
        result.textContent = "Connected · " + data.service + " · " + data.status;
      } catch (error) {
        result.textContent = "Connection failed · " + error.message;
      }
    });
  </script>
</body>
</html>
